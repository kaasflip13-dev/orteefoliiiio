<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EchoBound</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


    <!-- GAME -->

    <canvas id="game"></canvas>


    <!-- START MENU -->

    <div id="menu">

        <div class="menu-box">

            <h1>ECHOBOUND</h1>

            <p>THE LOST SIGNAL</p>

            <button id="startButton">
                START GAME
            </button>

            <div class="instructions">

                <div>W / S = RIJDEN</div>

                <div>A / D = DRAAIEN</div>

                <div>MUIS = KANON RICHTEN</div>

                <div>LINKERMUIS = SCHIETEN</div>

            </div>

        </div>

    </div>


    <!-- HUD -->

    <div id="hud">

        <div class="health">

            <span>HEALTH</span>

            <div class="bar">

                <div id="healthBar"></div>

            </div>

        </div>


        <div class="ammo">

            AMMO:
            <span id="ammo">20</span>

            <br>

            KILLS:
            <span id="kills">0</span>

        </div>


        <div id="crosshair">
            +
        </div>

    </div>


    <!-- GAME OVER -->

    <div id="gameOver">

        <div class="menu-box">

            <h1>GAME OVER</h1>

            <p id="gameOverText">
                Je tank is vernietigd.
            </p>

            <button id="restartButton">
                OPNIEUW
            </button>

        </div>

    </div>


    <!-- THREE.JS -->

    <script src="https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.min.js"></script>


    <!-- OUR GAME -->

    <script src="app.js"></script>


</body>

</html>
