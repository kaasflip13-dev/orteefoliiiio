<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoBound — The Lost Signal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">

    <!-- HOOFDMENU -->
    <div id="menu" class="screen">
        <div class="menu-card">

            <div class="eyebrow">SIGNAL LOST • SECTOR 07</div>

            <h1>
                ECHO<span>BOUND</span>
            </h1>

            <div class="tagline">
                THE LOST SIGNAL
            </div>

            <div class="menu-buttons">
                <button id="newRunBtn">NEW RUN</button>
                <button id="shopBtn">🛒 SHOP</button>
                <button id="loadBtn">LOAD GAME</button>
                <button id="achievementsBtn">🏆 ACHIEVEMENTS</button>
                <button id="controlsBtn">CONTROLS</button>
            </div>

            <div class="menu-tip">
                WASD drive • Mouse aim • Left click fire • R reload • ESC pause
            </div>

        </div>
    </div>


    <!-- HUD -->
    <div id="hud" class="hud" style="display:none">

        <div class="hud-left">

            <div class="stat">
                <span>HULL</span>
                <div class="bar">
                    <i id="healthFill"></i>
                </div>
            </div>

            <div class="stat">
                <span>ENERGY</span>
                <div class="bar energy">
                    <i id="energyFill"></i>
                </div>
            </div>

        </div>


        <div class="hud-right">

            <div class="readout">
                <small>AMMO</small>
                <b id="ammoText">12 / 12</b>
            </div>

            <div class="readout">
                <small>KILLS</small>
                <b id="killsText">0</b>
            </div>

            <div class="readout">
                <small>CREDITS</small>
                <b id="creditsText">100</b>
            </div>

        </div>


        <div class="crosshair">
            <span></span>
        </div>


        <div class="hud-buttons">
            <button id="mapBtn">MAP</button>
            <button id="pauseBtn">Ⅱ</button>
        </div>

    </div>

</div>


<script type="module" src="app.js"></script>

</body>
</html>
