<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EchoBound — The Lost Signal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- GAME -->
    <canvas id="game"></canvas>


    <!-- HUD -->
    <div id="hud">

        <div class="hud-top">

            <div class="hud-card">
                <div class="hud-label">HULL</div>

                <div class="bar">
                    <div id="healthBar" class="bar-fill health"></div>
                </div>

                <div class="hud-number">
                    <span id="healthText">100</span>%
                </div>
            </div>


            <div class="hud-card">
                <div class="hud-label">ENERGY</div>

                <div class="bar">
                    <div id="energyBar" class="bar-fill energy"></div>
                </div>

                <div class="hud-number">
                    <span id="energyText">100</span>%
                </div>
            </div>


            <div class="hud-card ammo-card">
                <div class="hud-label">AMMUNITION</div>

                <div id="ammo">
                    12 / 12
                </div>
            </div>


            <div class="hud-card">
                <div class="hud-label">KILLS</div>

                <div id="kills">
                    0
                </div>
            </div>


            <div class="hud-card">
                <div class="hud-label">CREDITS</div>

                <div id="credits">
                    0
                </div>
            </div>

        </div>


        <div class="crosshair">

            <div class="crosshair-line vertical"></div>
            <div class="crosshair-line horizontal"></div>
            <div class="crosshair-dot"></div>

        </div>


        <div class="bottom-hud">

            <div>
                WASD MOVE
            </div>

            <div>
                SHIFT BOOST
            </div>

            <div>
                MOUSE AIM
            </div>

            <div>
                LMB FIRE
            </div>

            <div>
                R RELOAD
            </div>

            <div>
                ESC PAUSE
            </div>

        </div>

    </div>


    <!-- THREE.JS GAME -->
    <script type="module" src="app.js"></script>

</body>
</html>
